name: Continuous Training (CT) Pipeline

on:
  push:
    paths:
      - 'app/train.py'
      - 'app/*.csv'
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        pip install --no-cache-dir -r app/requirements.txt

    - name: Run Data Ingestion, Preprocessing, and Training
      env:
        MLFLOW_TRACKING_URI: file:./mlruns
      run: |
        cd app
        python train.py

    - name: Commit and Push new Model Artifact
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -f app/model.pkl || true
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated model retraining artifact" && git push)
